name: Install or projection problem
description: Something went wrong installing the package, or wireless CarPlay / Android Auto / turn-by-turn isn't working.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The **Leafia kit** collects everything we need in 1–2 minutes and changes nothing on the car:

        1. Download the [Leafia kit](https://vyssecodes.github.io/HMG-Leafia-Plus/downloads/leafia-kit.zip) (standard) and unzip it to the root of a USB drive.
        2. If the problem is with CarPlay or Android Auto, try it once first so the logs have something in them. If it crashed, run the kit **before turning the car off**: the Android log is lost when the car powers down.
        3. Car on, plug in the drive, tap **Yes**, and wait for the success message.
        4. Zip `LEAFIA/public` and attach it below.

        **Don't attach `LEAFIA/private`.** It holds logs that can include phone names and Bluetooth addresses, Hyundai/Kia system files and firmware key files; we'll ask for it privately if we need it.
  - type: input
    id: car
    attributes:
      label: Car
      description: Make, model, year and country.
      placeholder: Kia EV6 2023, US
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: "`ro.build.product` from `LEAFIA/public/summary.txt` or `LEAFIA-REPORT.txt`."
      placeholder: CVEV.USA.0000.V015.012.260507
    validations:
      required: true
  - type: dropdown
    id: nemesis
    attributes:
      label: NEMESIS version
      description: summary.txt says `nemesis_1_15_or_newer=yes` or `no`.
      options:
        - 1.15 or newer
        - Older than 1.15
        - Not sure
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Package build
      description: The `build` line under "installed package metadata" in summary.txt, or the commit/date you built the package from.
      placeholder: 0b7d934 2026-10-22
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Include any on-screen message word for word.
    validations:
      required: true
  - type: textarea
    id: attach
    attributes:
      label: Support kit
      description: Drag the zipped `LEAFIA/public` folder here.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I attached only the `public` folder, not `private`.
          required: true
