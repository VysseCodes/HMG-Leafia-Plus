name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lpatch:
    name: Build and Test Lpatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pip dependencies
        # NOTE: Set up either a pyproject.toml or requirements.txt for pip dependencies
        run: |
          pip install bsdiff4

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Test lpatch
        run: |
          ./tools/lpatch/test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: lpatch
          path: ./tools/lpatch/

  build-buildkit:
    name: Build Build-kit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build fingerprint kit
        run: |
          ./tools/build-kit.sh fingerprint


      - name: Build support kit
        run: |
          ./tools/build-kit.sh support

      - uses: actions/upload-artifact@v7
        with:
          name: buildkits
          path: ./dist/*.zip

  build-package:
    name: Build Wireless Carplay/AA Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build package
        run: |
          ./tools/build-package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: wireless-carplay-aa
          path: ./dist/*.zip
