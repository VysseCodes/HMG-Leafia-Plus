name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit IDs (tags can be moved); the comment says which
# release that is. Build artifacts are only uploaded for pushes to main, so nothing
# built from a pull request's code is published as a download.

jobs:
  build-lpatch:
    name: Build and Test Lpatch
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pip dependencies
        run: |
          pip install --require-hashes -r tools/requirements.txt

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Test lpatch
        run: |
          ./tools/lpatch/test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: lpatch
          path: ./tools/lpatch/

  verify-shipped:
    name: Verify Shipped Binaries and Downloads
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang 18 and lld 18
        # the toolchain the shipped libev6aac.so was built with (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: libev6aac.so rebuilds byte for byte from src/ev6aac
        run: |
          CLANG=clang-18 ./src/ev6aac/build.sh "$RUNNER_TEMP/libev6aac.so"
          shipped=packages/wireless-carplay-aa/comp/4_audio/files/libev6aac.so
          if cmp "$RUNNER_TEMP/libev6aac.so" "$shipped"; then
            echo "libev6aac.so matches its source"
          else
            echo "--- sections: name address offset size alignment (shipped | rebuilt):"
            paste <(readelf -SW "$shipped" | sed -n 's/^ *\[ *[0-9]*\] //p' | awk '{print $1, $3, $4, $5, $NF}') \
                  <(readelf -SW "$RUNNER_TEMP/libev6aac.so" | sed -n 's/^ *\[ *[0-9]*\] //p' | awk '{print $1, $3, $4, $5, $NF}')
            echo "--- strings that differ:"
            diff <(strings -n 4 "$shipped" | sort) <(strings -n 4 "$RUNNER_TEMP/libev6aac.so" | sort) || true
            clang-18 --version | head -1
            exit 1
          fi

      - name: Website kit downloads match kits/leafia
        run: |
          ./tools/check-downloads.sh

  build-buildkit:
    name: Build Kit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Leafia kit
        run: |
          ./tools/build-kit.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: leafia-kit
          path: ./dist/*.zip

  build-package:
    name: Build Wireless Carplay/AA Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build package
        run: |
          ./tools/build-package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: wireless-carplay-aa
          path: ./dist/*.zip
